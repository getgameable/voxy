name: release

# Publishes `@getgameable/voxy` to npm when main carries a version
# that is not on npm yet. Releasing is bumping the version
# (`npm version <x.y.z> --no-git-tag-version`) and letting it reach main.
#
# The token only stages (`npm stage publish`, npm 12): a staged version is not
# installable until an owner approves it on npmjs.com (or `npm stage approve
# <id>`) with their second factor. Re-running this before the approval stages
# the same version again; reject the stale one.
#
# Runs only in the public repository: the internal tree carries this file too.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the release and its tag
  id-token: write # npm provenance

jobs:
  publish:
    if: github.repository == 'getgameable/voxy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm 12, for `npm stage`
        run: npm install --global npm@12

      - name: Is this version on npm?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = 0.0.0 ] || npm view "@getgameable/voxy@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: npm ci

      - if: steps.version.outputs.publish == 'true'
        run: npm run check

      - name: Stage @getgameable/voxy on npm (approve it on npmjs.com)
        if: steps.version.outputs.publish == 'true'
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and release
        if: steps.version.outputs.publish == 'true'
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --generate-notes --notes "Staged on npm: installable once an owner approves it."
        env:
          GH_TOKEN: ${{ github.token }}
